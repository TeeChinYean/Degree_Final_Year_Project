# ==================================================
# YOLO12 Fine-tuning Configuration
# Focus: Improving Aluminium & Paper Accuracy
# ==================================================

task: detect
mode: train
# 繼續使用原本的平衡數據集
data: F:/Degree_Final_Year_Project/Balanced_V5_Enhanced/data.yaml
# 關鍵：載入你剛練好的 best.pt 作為預訓練權重
model: F:/Degree_Final_Year_Project/V4_Retrain/yolo12_balanced_final/weights/best.pt

# 1. 微調參數
epochs: 50            # 微調不需要 150 輪，30-50 輪即可
batch: 16
imgsz: 640
workers: 8

# 2. 學習率優化 (微調要用更小的 Learning Rate)
lr0: 0.001            # 從 0.01 降到 0.001，防止破壞已學好的特徵
lrf: 0.01             # 最終學習率保持比例
optimizer: AdamW

# 3. 補上數據增強 (之前漏掉的部分)
augment: true
mosaic: 1.0           # 強制開啟
mixup: 0.1            # 增加一些 Mixup，讓模型對重疊的紙張更有經驗
degrees: 15.0         # 增加旋轉角度，應對鋁罐不同的倒放姿勢
fliplr: 0.5
close_mosaic: 10      # 最後 10 輪關閉增強

# 4. 針對性損失調整
box: 10.0             # 再次調高 box，讓模型對薄片（Paper）的定位更敏感
cls: 0.5