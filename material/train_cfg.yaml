# ==================================================
# YOLO12 Optimized Training Configuration
# Purpose: Final Year Project - Trash Classification
# Target Hardware: RTX 3050 4GB (Laptop)
# ==================================================

# 1. 任務與路徑
task: detect
mode: train
data: F:/Degree_Final_Year_Project/resized_dataset/data.yaml
model: yolov5n.pt
project: F:/Degree_Final_Year_Project/V4_Retrain
name: 320p_yolo5

# 2. 訓練基礎參數
epochs: 120
imgsz: 320
batch: 64              # RTX 3050 4GB 安全值，若顯存充足可試 12
device: 0
workers: 8
amp: true             # 開啟混合精度，節省顯存
cache: disk           # 減少 RAM 壓力
seed: 42              # 固定隨機種子，方便實驗復現
augment: true         # 開啟數據增強，提升模型泛化能力

# 3. 優化器與超參數 (修正了之前的等號與逗號錯誤)
optimizer: AdamW
lr0: 0.005
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 5.0
warmup_momentum: 0.937
warmup_bias_lr: 0.1

# 4. 損失函數權重 (針對「只偵測特定物體」的修正)
box: 7.5               # 強化邊框回歸，強迫模型學習物體精確形狀
cls: 0.5               # 降低分類權重，減少類別數量不均造成的偏見
dfl: 1.5               # 輔助定位損失

# 5. 數據增強 (防止過擬合與偏見)
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 10.0          # 輕微旋轉，應對不同角度的垃圾
translate: 0.1
scale: 0.5
shear: 2.0             # 輕微剪切增強
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0            # 必須開啟，將四張圖拼在一起，解決模型對大物體的依賴
mixup: 0.1
close_mosaic: 15       # 最後 15 輪關閉增強，穩定精度

# 6. 訓練策略
save: true
save_period: 10        # 每 10 輪備份一次
val: true
plots: true
patience: 30           # 容忍 30 輪精度不提升才早停